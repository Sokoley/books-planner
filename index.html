<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4e7e4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Чтение" />
    <title>Планировщик чтения</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,520;7..72,650&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="desk-note">
        <p class="desk-kicker">бумажный дневник, только в телефоне</p>
        <h2>Страницы, которые ты уже прошла, и день, когда дочитаешь.</h2>
        <p>
          Закладка, факт за день, остаток и новая дата финиша считаются так же,
          как в таблице.
        </p>
      </aside>

      <div class="phone">
        <header class="top">
          <p class="brand">Планировщик чтения</p>
          <p class="greeting" id="greeting"></p>
        </header>
        <main class="view" id="view"></main>
        <nav class="nav" aria-label="Разделы">
          <button type="button" data-tab="today" class="is-active">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 4.5h9.2A2.8 2.8 0 0 1 18 7.3V20l-6-3.2L6 20V4.5Z"
              />
            </svg>
            Сегодня
          </button>
          <button type="button" data-tab="diary">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="5" width="16" height="15" rx="2" />
              <path d="M8 3.5v3M16 3.5v3M4 9.5h16" />
            </svg>
            Дневник
          </button>
          <button type="button" data-tab="book">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 5.5c2.2-1 4.4-1 6.5.2 2.1-1.2 4.3-1.2 6.5-.2V19c-2.2-1-4.4-1-6.5.2C9.4 18 7.2 18 5 19V5.5Z" />
              <path d="M11.5 6.2v13" />
            </svg>
            Книга
          </button>
        </nav>
      </div>
    </div>

    <dialog id="log-dialog" class="sheet">
      <form id="log-form" method="dialog">
        <div class="grabber"></div>
        <p class="sheet-kicker" id="log-kicker"></p>
        <h3 id="log-title">Страница остановки</h3>
        <p class="sheet-lead" id="log-lead"></p>
        <label class="field">
          <span>Страница остановки</span>
          <input
            id="log-page"
            inputmode="numeric"
            autocomplete="off"
            enterkeyhint="done"
            placeholder="0"
          />
        </label>
        <p class="sheet-error" id="log-error" hidden></p>
        <dl class="preview" id="log-preview"></dl>
        <div class="sheet-actions">
          <button type="submit" class="btn" id="log-save">Сохранить</button>
          <button type="button" class="btn ghost danger" id="log-delete" hidden>
            Удалить запись
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
